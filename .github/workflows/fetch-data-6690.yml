name: Update 6690 Data 

on:
  schedule:
    - cron: '*/1 * * * *' # Automatically fetches fresh data every 5 minutes
  workflow_dispatch:     # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch bus data from API
        run: |
          curl -s -H "X-Api-Authentication: 4670f468049bbee2260" \
            "https://online.nsmart.rs/publicapi/v1/announcement/announcement.php?ibfm=TM00000&station_uid=6690" \
            -o data.json

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data-6690.json
          git diff --staged --quiet || (git commit -m "Auto-update bus data" && git push)
