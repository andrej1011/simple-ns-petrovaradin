<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ŠEKSPIROVA PARK</title>
    <style>
        body { background: black; color: white; font-family: monospace; padding: 20px; font-size: 1.2rem; }
        .bus-entry { padding: 10px 0; border-bottom: 1px solid #333; }
        #last-updated { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1 id="station-name">Loading station name...</h1>
    <div id="last-updated">Updating...</div>
    
    <div id="bus-container"></div>

    <script>
        async function fetchBusData() {
            const container = document.getElementById('bus-container');
            const lastUpdated = document.getElementById('last-updated');

            try {
                // Reads the local data.json file generated inside the repository
                const response = await fetch('./data-6690.json?t=' + Date.now());

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const data = await response.json();
                
                if (container) container.innerHTML = '';
                if (data[0]?.station_name) {
                    const stationEl = document.getElementById('station-name');
                    if (stationEl) stationEl.innerText = data[0].station_name;
                }

                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (item.seconds_left === undefined) return;

                        const totalSeconds = parseInt(item.seconds_left, 10);
                        const minutes = Math.floor(totalSeconds / 60);
                        const seconds = totalSeconds % 60;
                        
                        const busNumber = item.line_number || "N/A";
                        const vehicleId = item.id || "N/A"; 

                        const div = document.createElement('div');
                        div.className = 'bus-entry';
                        div.innerText = `BUS: ${busNumber} | ${minutes}min ${seconds}s | Vehicle ID: ${vehicleId}`;
                        if (container) container.appendChild(div);
                    });
                }

                if (lastUpdated) lastUpdated.innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error(error);
                if (container) {
                    container.innerHTML = `<div style="color: red;">Data is updating, please refresh...</div>`;
                }
            }
        }

        fetchBusData();
        setInterval(fetchBusData, 15000);
    </script>
</body>
</html>
